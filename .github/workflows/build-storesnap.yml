name: Build StoreSnap 2.0.1 Fixed APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StoreSnap_2_0_1_Fixed.zip'
      - '.github/workflows/build-storesnap-2-0-1.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Accept Android SDK licences
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract StoreSnap project
        run: |
          rm -rf extracted
          unzip -o StoreSnap_2_0_1_Fixed.zip -d extracted
          test -f extracted/StoreSnap/settings.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build StoreSnap APK
        working-directory: extracted/StoreSnap
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoreSnap-2.0.1-fixed-debug-APK
          path: extracted/StoreSnap/app/build/outputs/apk/debug/app-debug.apk
          
