name: Build StoreSnap APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StoreSnap_Android_Project.zip'
      - '.github/workflows/build-storesnap.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract StoreSnap project
        run: |
          unzip -o StoreSnap_Android_Project.zip -d extracted
          test -f extracted/StoreSnap/settings.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build StoreSnap APK
        working-directory: extracted/StoreSnap
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoreSnap-debug-APK
          path: extracted/StoreSnap/app/build/outputs/apk/debug/app-debug.apk
          
